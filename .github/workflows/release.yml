name: Release & Package Distribution

on:
  push:
    tags:
      - 'v*'

jobs:
  # Extract version from tag
  setup:
    name: Setup Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ github.ref_name }}
    steps:
      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  # Build Linux binary
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake llvm-14-dev clang-14 build-essential python3.10

      - name: Build C++ compiler
        run: |
          mkdir -p compiler/build
          cd compiler/build
          cmake .. -DLLVM_ROOT=/usr/lib/llvm-14 -DCMAKE_BUILD_TYPE=Release
          cmake --build . --parallel $(nproc)

      - name: Create distribution package
        run: |
          mkdir -p jocky-linux-x64/bin jocky-linux-x64/lib
          cp compiler/build/jockyc jocky-linux-x64/bin/
          cp -r src/jocky jocky-linux-x64/lib/
          chmod +x jocky-linux-x64/bin/jockyc
          zip -r jocky-linux-x64.zip jocky-linux-x64/

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: jocky-linux-x64
          path: jocky-linux-x64.zip

  # Build macOS binary (ARM64 and x64)
  build-macos:
    name: Build macOS Binary
    runs-on: macos-latest
    needs: setup
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          brew install cmake llvm@14 python@3.10

      - name: Build C++ compiler
        run: |
          export LLVM_ROOT=$(brew --prefix llvm@14)
          mkdir -p compiler/build
          cd compiler/build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DLLVM_ROOT=$LLVM_ROOT
          cmake --build . --parallel $(sysctl -n hw.ncpu)

      - name: Create distribution package
        run: |
          mkdir -p jocky-macos-${{ matrix.arch }}/bin jocky-macos-${{ matrix.arch }}/lib
          cp compiler/build/jockyc jocky-macos-${{ matrix.arch }}/bin/
          cp -r src/jocky jocky-macos-${{ matrix.arch }}/lib/
          chmod +x jocky-macos-${{ matrix.arch }}/bin/jockyc
          tar czf jocky-macos-${{ matrix.arch }}.tar.gz jocky-macos-${{ matrix.arch }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: jocky-macos-${{ matrix.arch }}
          path: jocky-macos-${{ matrix.arch }}.tar.gz

  # Build Windows binary
  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest
    needs: setup
    strategy:
      matrix:
        arch: [x64, Win32]
    steps:
      - uses: actions/checkout@v3

      - name: Setup LLVM
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: "14"
          directory: ${{ runner.temp }}/llvm

      - name: Build C++ compiler
        run: |
          mkdir -p compiler\build
          cd compiler\build
          cmake .. -A ${{ matrix.arch }} -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS

      - name: Create distribution package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "jocky-windows-${{ matrix.arch }}\bin" -Force | Out-Null
          New-Item -ItemType Directory -Path "jocky-windows-${{ matrix.arch }}\lib" -Force | Out-Null
          Copy-Item "compiler\build\Release\jockyc.exe" "jocky-windows-${{ matrix.arch }}\bin\"
          Copy-Item -Recurse "src\jocky" "jocky-windows-${{ matrix.arch }}\lib\"
          Compress-Archive -Path "jocky-windows-${{ matrix.arch }}" -DestinationPath "jocky-windows-${{ matrix.arch }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: jocky-windows-${{ matrix.arch }}
          path: jocky-windows-${{ matrix.arch }}.zip

  # Create GitHub Release
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [setup, build-linux, build-macos, build-windows]
    steps:
      - uses: actions/checkout@v3

      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Generate checksums
        run: |
          mkdir -p checksums
          for file in jocky-*/*.{zip,tar.gz}; do
            sha256sum "$file" > "checksums/$(basename $file).sha256"
            echo "$(basename $file): $(cat checksums/$(basename $file).sha256 | awk '{print $1}')"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            jocky-linux-x64/jocky-linux-x64.zip
            jocky-macos-arm64/jocky-macos-arm64.tar.gz
            jocky-macos-x86_64/jocky-macos-x86_64.tar.gz
            jocky-windows-x64/jocky-windows-x64.zip
            jocky-windows-Win32/jocky-windows-Win32.zip
            checksums/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Update Homebrew tap
  update-homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: [setup, github-release]
    if: success()
    steps:
      - uses: actions/checkout@v3

      - name: Compute checksums
        run: |
          echo "Computing Linux checksum..."
          LINUX_SHA=$(curl -s https://github.com/devalgupta/JOCKY/releases/download/${{ needs.setup.outputs.tag }}/jocky-linux-x64.zip | sha256sum | awk '{print $1}')
          echo "LINUX_SHA=$LINUX_SHA" >> $GITHUB_ENV

      - name: Update Homebrew formula
        if: vars.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@v3
        with:
          repository: devalgupta/homebrew-jocky
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-jocky

      - name: Commit Homebrew update
        if: vars.HOMEBREW_TAP_TOKEN != ''
        run: |
          cd homebrew-jocky
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          # Formula will be automatically updated via release workflow
          git add .
          git commit -m "Update jocky formula to ${{ needs.setup.outputs.version }}" || true
          git push

  # Update Chocolatey package
  update-chocolatey:
    name: Update Chocolatey Package
    runs-on: windows-latest
    needs: [setup, github-release]
    if: success() && vars.CHOCO_API_KEY != ''
    steps:
      - uses: actions/checkout@v3

      - name: Install Chocolatey
        run: |
          if (-not (Test-Path "C:\ProgramData\chocolatey")) {
            iex ((New-Object System.Net.ServicePointManager).ServerCertificateValidationCallback = {$true}); iex ((New-Object Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))
          }

      - name: Create Chocolatey package
        run: |
          cd packaging\chocolatey
          choco pack jocky.nuspec --outputdirectory="."

      - name: Push to Chocolatey
        run: |
          $nupkg = Get-ChildItem "packaging\chocolatey\*.nupkg" | Select-Object -First 1
          choco push "$($nupkg.FullName)" --api-key ${{ secrets.CHOCO_API_KEY }}
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}

  # Create release notes
  create-release-notes:
    name: Create Release Notes
    runs-on: ubuntu-latest
    needs: [setup, github-release]
    if: success()
    steps:
      - uses: actions/checkout@v3

      - name: Generate release notes
        run: |
          cat > RELEASE_NOTES.md << EOF
          # JOCKY ${{ needs.setup.outputs.version }}

          Release Date: $(date -u +'%Y-%m-%d')

          ## Installation

          ### macOS (Homebrew)
          \`\`\`bash
          brew tap devalgupta/homebrew-jocky
          brew install jocky
          \`\`\`

          ### Linux (AUR)
          \`\`\`bash
          yay -S jocky
          \`\`\`

          ### Windows (Chocolatey)
          \`\`\`powershell
          choco install jocky
          \`\`\`

          ### Manual Installation
          Download from [GitHub Releases](https://github.com/devalgupta/JOCKY/releases/tag/${{ needs.setup.outputs.tag }})

          ## Verification

          After installation, verify with:
          \`\`\`bash
          jockyc --version
          \`\`\`

          ## Features

          - Advanced code obfuscation
          - Anti-disassembly techniques
          - Anti-debugging protection
          - Anti-analysis evasion
          - Anti-instrumentation methods
          - Code mutation framework
          - Runtime obfuscation

          ## Documentation

          See [Installation Guide](https://github.com/devalgupta/JOCKY/blob/main/docs/INSTALLATION_GUIDE.md) for detailed instructions.

          ---

          **SHA256 Checksums:**

          \`\`\`
          $(find . -name "*.sha256" -exec cat {} \;)
          \`\`\`
          EOF

          cat RELEASE_NOTES.md

      - name: Upload release notes
        uses: actions/upload-artifact@v3
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  # Final notification
  notify:
    name: Notify Release Complete
    runs-on: ubuntu-latest
    needs: [setup, update-homebrew, update-chocolatey, create-release-notes]
    if: always()
    steps:
      - name: Release Summary
        run: |
          echo "Release ${{ needs.setup.outputs.version }} completed!"
          echo "Tag: ${{ needs.setup.outputs.tag }}"
          echo "GitHub Release: https://github.com/devalgupta/JOCKY/releases/tag/${{ needs.setup.outputs.tag }}"
