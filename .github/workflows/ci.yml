name: CI/CD Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install flake8 black mypy pytest
      - name: Lint with flake8
        run: flake8 src/jocky tests --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Format check with black
        run: black --check src/jocky tests
      - name: Type check with mypy
        run: mypy src/jocky --ignore-missing-imports

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e . pytest pytest-cov click rich hypothesis
      - name: Run tests
        run: pytest tests/unit tests/integration -v --cov=src/jocky --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  fuzz:
    name: Fuzzing Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -e . hypothesis pytest-timeout
      - name: Run property-based tests (lexer)
        run: python -m pytest tests/unit/test_lexer_properties.py -v --tb=short --timeout=30
      - name: Run property-based tests (parser)
        run: python -m pytest tests/unit/test_parser_properties.py -v --tb=short --timeout=30
      - name: Test lexer fuzzer on corpus
        run: |
          for f in tests/fuzz/corpus/*.jky; do
            python tests/fuzz/fuzz_lexer.py < "$f" || true
          done
      - name: Test parser fuzzer on corpus
        run: |
          for f in tests/fuzz/corpus/*.jky; do
            python tests/fuzz/fuzz_parser.py < "$f" || true
          done
      - name: Archive fuzz corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: tests/fuzz/corpus/
          if-no-files-found: ignore

  build-cpp:
    name: Build C++ Compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-14-dev clang-14 cmake build-essential
      - name: Build compiler
        run: |
          mkdir -p compiler/build
          cd compiler/build
          cmake .. -DLLVM_ROOT=/usr/lib/llvm-14
          make -j$(nproc)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jockyc-linux
          path: compiler/build/jockyc

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-cpp
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Download compiler
        uses: actions/download-artifact@v3
        with:
          name: jockyc-linux
          path: compiler/build
      - name: Install Python deps
        run: |
          pip install -e . pytest click rich
      - name: Run integration tests
        run: |
          chmod +x compiler/build/jockyc
          pytest tests/integration/ -v

  performance:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    needs: build-cpp
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Download compiler
        uses: actions/download-artifact@v3
        with:
          name: jockyc-linux
          path: compiler/build
      - name: Install dependencies
        run: |
          pip install -e . pytest click rich
      - name: Run performance tests
        run: |
          chmod +x compiler/build/jockyc
          pytest tests/performance/ -v --tb=short
      - name: Upload performance baselines
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-baselines
          path: tests/performance/baselines/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install bandit
        run: pip install bandit
      - name: Security scan
        run: bandit -r src/jocky -f json -o bandit-report.json || true
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.json

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test-python, build-cpp, integration, performance, fuzz]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v3
      - name: Download artifacts
        uses: actions/download-artifact@v3
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            jockyc-linux/jockyc
            security-report/bandit-report.json
