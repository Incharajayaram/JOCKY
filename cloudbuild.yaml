steps:
  # Generate a short-lived access token using Cloud Build SA's ADC
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: get-token
    entrypoint: bash
    args:
      - -c
      - gcloud auth print-access-token > /workspace/gcs-token.txt

  # Build backend — passes token as Docker secret so it never lands in image layers
  - name: gcr.io/cloud-builders/docker
    id: build-backend
    entrypoint: bash
    env:
      - DOCKER_BUILDKIT=1
    args:
      - -c
      - |
        docker build \
          --platform linux/amd64 \
          --secret id=gcs-token,src=/workspace/gcs-token.txt \
          -f Dockerfile.backend \
          -t $_IMG_BACKEND \
          .
    waitFor:
      - get-token

  # Build frontend (no secrets needed)
  - name: gcr.io/cloud-builders/docker
    id: build-frontend
    args:
      - build
      - --platform=linux/amd64
      - -f
      - Dockerfile.frontend
      - -t
      - $_IMG_FRONTEND
      - .
    waitFor:
      - get-token

images:
  - $_IMG_BACKEND
  - $_IMG_FRONTEND

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
