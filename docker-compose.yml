version: '3.8'

services:
  # Frontend service (Node.js + React)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - VITE_API_BASE=${VITE_API_BASE:-http://localhost:8000}
    depends_on:
      - backend
    networks:
      - jocky-network
    volumes:
      - ./web/frontend:/app
      - /app/node_modules

  # Backend service (FastAPI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      - compiler
    networks:
      - jocky-network
    volumes:
      - ./web/backend:/app
      - ./build:/tmp/jocky_build

  # Compiler service (JOCKY toolchain)
  compiler:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - jocky-network
    volumes:
      - ./src:/workspace/jocky/src
      - ./scripts:/workspace/jocky/scripts
      - ./build:/workspace/jocky/build
    # Keep container running for use as a service
    command: tail -f /dev/null

  # Reverse proxy (Caddy) - optional, for production
  caddy:
    image: caddy:2.7.6-alpine
    ports:
      - "${CADDY_PORT:-443}:443"
      - "80:80"
    environment:
      - FRONTEND_HOST=${FRONTEND_HOST:-frontend:3000}
      - BACKEND_HOST=${BACKEND_HOST:-backend:8000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - jocky-network
    depends_on:
      - frontend
      - backend
    profiles:
      - production

networks:
  jocky-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
