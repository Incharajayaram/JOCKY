services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    networks:
      - jocky-net
    volumes:
      # Toolchain is 4.2 GB — bind-mount from host, read-only inside container
      - ./toolchain:/workspace/jocky/toolchain:ro
      # Persistent build artifacts (compiled binaries available for download)
      - jocky_build:/workspace/jocky/build
      # Persistent SQLite database
      - jocky_db:/workspace/jocky/data
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=sqlite:////workspace/jocky/data/jocky_jobs.db
      - MAX_COMPILATION_TIME=${MAX_COMPILATION_TIME:-600}
      # CORS: frontend nginx is on the same host, so same-origin — restrict to internal
      - CORS_ORIGINS=http://frontend,http://localhost
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${PORT:-80}:80"
    networks:
      - jocky-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  jocky-net:
    driver: bridge

volumes:
  jocky_build:
  jocky_db:
