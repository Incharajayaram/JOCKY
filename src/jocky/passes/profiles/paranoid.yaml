name: paranoid
description: Everything + polymorphic
passes:
  - string_encrypt
  - constant_obfuscate
  - symbol_obfuscate
  - crypto_hash
  - scf_obfuscate
  - import_obfuscate
  - bogus_control_flow
  - flatten_cfg
  - instruction_substitution
  - linear_mba
  - opaque_predicates
  - indirect_call
  - strip_signature
  - anti_debug
  - virtualize
polymorphic: true
seed: random
optimization_level: 3
packing:
  enabled: true
  tool: upx
  args: ["--best", "--lzma", "--ultra-brute"]
