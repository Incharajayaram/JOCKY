events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # WebSocket — long timeout to keep compilation log streams alive
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # API, Swagger docs, and OpenAPI schema
        location ~ ^/(api|docs|redoc|openapi\.json) {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Allow long compilation requests (up to 10 min)
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            client_max_body_size 10m;
        }

        # SPA — any unmatched path falls back to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
