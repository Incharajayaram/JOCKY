[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jocky"
version = "0.1.0"
description = "JOCKY"
authors = [
    {name = "JOCKY Team"}
]
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
jocky = "jocky.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
